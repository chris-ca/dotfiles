# tmux-256color where its terminfo exists, screen-256color otherwise
if 'infocmp tmux-256color >/dev/null 2>&1' \
   'set -g default-terminal "tmux-256color"' \
   'set -g default-terminal "screen-256color"'
# Outer terminal supports 256 colours and truecolor, even if it reports plain TERM=xterm
set -as terminal-overrides ',xterm*:colors=256:Tc'

# Stable agent socket maintained by ~/.ssh/rc, so detached sessions keep working
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

set -g prefix C-a
setw -g mode-keys vi
unbind C-b
bind C-a send-prefix

set-window-option -g xterm-keys on

set-option -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# Copy to the local terminal's clipboard via OSC 52, also from tmux on a remote
# host over ssh. tmux-yank additionally uses clip.exe/xclip/wl-copy when present.
set -s set-clipboard on

# Splits and new windows start in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

bind m \
  set -g mouse on \;\
  display 'Mouse: ON'

bind M \
  set -g mouse off \;\
  display 'Mouse: OFF'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Bootstrap TPM and any missing plugins (fast no-op once installed),
# then initialize TPM (keep at the very bottom)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1'
run -b '~/.tmux/plugins/tpm/tpm'

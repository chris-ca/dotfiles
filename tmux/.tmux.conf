set -g default-terminal "tmux-256color"

# Stable agent socket maintained by ~/.ssh/rc, so detached sessions keep working
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

set -g prefix C-a
setw -g mode-keys vi
unbind C-b
bind C-a send-prefix

set-window-option -g xterm-keys on

set-option -g base-index 1
set-window-option -g pane-base-index 1

bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

bind m \
  set -g mouse on \;\
  display 'Mouse: ON'

bind M \
  set -g mouse off \;\
  display 'Mouse: OFF'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Bootstrap TPM on new hosts, then initialize it (keep at the very bottom)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run -b '~/.tmux/plugins/tpm/tpm'
